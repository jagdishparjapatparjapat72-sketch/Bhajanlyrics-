<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>भजन — BhajanLyrics</title>
  <meta name="description" content="भजन के पूरे बोल हिंदी में पढ़ें — BhajanLyrics।">
  <meta name="theme-color" content="#f4770b">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="bhajan-page">
    <nav class="breadcrumb">
      <a href="index.html">होम</a> › <a href="#" id="bcCat">श्रेणी</a> › <span id="bcTitle">भजन</span>
    </nav>

    <article class="bp-card" id="bpCard">
      <div class="skeleton" style="min-height:320px"></div>
    </article>

    <!-- संबंधित भजन -->
    <section class="section related-sec">
      <div class="section-head"><h2>🎵 संबंधित भजन</h2></div>
      <div class="bhajan-grid" id="relatedGrid"></div>
    </section>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script src="js/firebase-config.js"></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
  <script>
    document.addEventListener("DOMContentLoaded", async () => {
      const slug = new URLSearchParams(location.search).get("b") || "";
      const b = await DB.getBySlug(slug);

      if (!b) {
        $("#bpCard").innerHTML = `<div class="empty-state"><div class="es-icon">🪔</div>
          <h1 style="font-size:1.3rem;margin-bottom:8px">भजन नहीं मिला</h1>
          <a class="tool-btn primary" href="index.html" style="margin-top:12px">🏠 होम पर जाएँ</a></div>`;
        return;
      }

      // SEO
      const plain = String(b.lyrics).replace(/<[^>]+>/g, " ").replace(/\s+/g, " ").trim();
      document.title = b.title + " — " + catName(b.category) + " | BhajanLyrics";
      document.querySelector('meta[name="description"]').content =
        b.title + " के पूरे बोल हिंदी में पढ़ें। " + plain.slice(0, 120);
      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "MusicComposition",
        "name": b.title,
        "inLanguage": "hi",
        "lyrics": { "@type": "CreativeWork", "text": plain.slice(0, 400) },
        "genre": catName(b.category),
        ...(b.singer ? { "composer": { "@type": "Person", "name": b.singer } } : {})
      });
      document.head.appendChild(ld);

      $("#bcCat").textContent = catName(b.category);
      $("#bcCat").href = "shreni.html?c=" + b.category;
      $("#bcTitle").textContent = b.title;

      // lyrics HTML (rich text) या plain — दोनों संभालें
      const isHtml = /<\w+[^>]*>/.test(String(b.lyrics));
      const lyricsHtml = isHtml ? b.lyrics : esc(b.lyrics);

      let yt = "";
      if (b.youtube) {
        const m = String(b.youtube).match(/(?:v=|youtu\.be\/|embed\/|shorts\/)([\w-]{11})/);
        if (m) yt = `<div class="yt-wrap"><iframe loading="lazy" src="https://www.youtube-nocookie.com/embed/${m[1]}" title="${esc(b.title)}" allowfullscreen></iframe></div>`;
      }

      $("#bpCard").innerHTML = `
        ${b.thumbnail ? `<img src="${esc(b.thumbnail)}" alt="${esc(b.title)}" loading="lazy" style="border-radius:14px;margin-bottom:18px;max-height:320px;object-fit:cover;width:100%">` : ""}
        <h1>${esc(b.title)}</h1>
        <div class="bp-meta">
          <span class="bc-cat">${catIcon(b.category)} ${esc(catName(b.category))}</span>
          ${b.singer ? `<span>🎤 ${esc(b.singer)}</span>` : ""}
          <span>👁️ ${(b.views || 0) + 1} बार पढ़ा गया</span>
        </div>
        <div class="bp-toolbar">
          <button class="tool-btn primary" id="copyBtn">📋 कॉपी करें</button>
          <button class="tool-btn" id="shareBtn">📤 शेयर करें</button>
          <button class="tool-btn" id="printBtn">🖨️ प्रिंट</button>
          <button class="tool-btn" id="fontMinus">अ−</button>
          <button class="tool-btn" id="fontPlus">अ+</button>
        </div>
        <div class="lyrics-box" id="lyricsBox">${lyricsHtml}</div>
        ${yt}`;

      // टूलबार
      $("#copyBtn").addEventListener("click", () => {
        navigator.clipboard.writeText(b.title + "\n\n" + plain.replace(/ {2,}/g, "\n") + "\n\n— BhajanLyrics")
          .then(() => toast("✅ भजन कॉपी हो गया!"));
      });
      $("#shareBtn").addEventListener("click", async () => {
        const data = { title: b.title, text: b.title + " — BhajanLyrics", url: location.href };
        if (navigator.share) { try { await navigator.share(data); } catch (e) {} }
        else { navigator.clipboard.writeText(location.href); toast("🔗 लिंक कॉपी हो गया!"); }
      });
      $("#printBtn").addEventListener("click", () => window.print());
      let size = 1.18;
      $("#fontPlus").addEventListener("click", () => {
        size = Math.min(2, size + 0.12);
        $("#lyricsBox").style.setProperty("font-size", size + "rem");
      });
      $("#fontMinus").addEventListener("click", () => {
        size = Math.max(0.85, size - 0.12);
        $("#lyricsBox").style.setProperty("font-size", size + "rem");
      });

      // व्यूज़ बढ़ाएँ
      DB.addView(b);

      // संबंधित भजन
      const all = await DB.getAll();
      const rel = all.filter(x => x.category === b.category && x.id !== b.id).slice(0, 3);
      const more = all.filter(x => x.id !== b.id && !rel.includes(x)).slice(0, 3 - Math.min(rel.length, 3) + 3);
      const finalRel = [...rel, ...more].slice(0, 3);
      $("#relatedGrid").innerHTML = finalRel.map(bhajanCard).join("") ||
        `<div class="empty-state" style="grid-column:1/-1">कोई संबंधित भजन नहीं।</div>`;
    });
  </script>
</body>
</html>
