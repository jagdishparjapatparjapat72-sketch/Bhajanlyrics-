<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>एडमिन पैनल — BhajanLyrics</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f4770b">
  <link rel="icon" href="../icons/icon-192.png">
  <link rel="stylesheet" href="../css/style.css">
  <style>
    .admin-wrap{max-width:980px;margin:0 auto;padding:26px 16px 60px}
    .admin-tabs{display:flex;gap:8px;margin:18px 0 22px;flex-wrap:wrap}
    .admin-tabs button{padding:10px 20px;border-radius:12px;border:1.5px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;transition:.2s}
    .admin-tabs button.active{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#fff;border-color:transparent}
    .form-card{background:var(--surface);border:1.5px solid var(--border);border-radius:20px;padding:clamp(18px,3vw,30px);box-shadow:var(--shadow)}
    .form-grid{display:grid;gap:16px;grid-template-columns:1fr}
    @media(min-width:700px){.form-grid.two{grid-template-columns:1fr 1fr}}
    .field label{display:block;font-weight:700;margin-bottom:6px;font-size:.93rem}
    .field label small{color:var(--text-soft);font-weight:500}
    .field input,.field select,.field textarea{width:100%;padding:11px 14px;border-radius:12px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-family:inherit;font-size:1rem;outline:none}
    .field input:focus,.field select:focus{border-color:var(--saffron)}
    /* Rich Text Editor */
    .rte-toolbar{display:flex;gap:5px;flex-wrap:wrap;padding:8px;border:1.5px solid var(--border);border-bottom:none;border-radius:12px 12px 0 0;background:var(--bg)}
    .rte-toolbar button{width:36px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--surface);color:var(--text);font-weight:700;font-size:.9rem}
    .rte-toolbar button:hover{border-color:var(--saffron);color:var(--saffron)}
    #rte{min-height:260px;max-height:480px;overflow-y:auto;padding:14px 16px;border:1.5px solid var(--border);border-radius:0 0 12px 12px;background:var(--bg);font-family:'Tiro Devanagari Hindi',serif;font-size:1.1rem;line-height:2;outline:none;white-space:pre-wrap}
    #rte:focus{border-color:var(--saffron)}
    .thumb-preview{margin-top:10px;max-width:220px;border-radius:12px;display:none}
    .form-actions{display:flex;gap:10px;margin-top:22px;flex-wrap:wrap}
    .btn{padding:12px 26px;border-radius:12px;border:none;font-weight:800;font-size:1rem;transition:.2s}
    .btn.publish{background:linear-gradient(135deg,var(--saffron),var(--gold));color:#fff}
    .btn.publish:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
    .btn.ghost{background:var(--bg);border:1.5px solid var(--border);color:var(--text)}
    /* सूची */
    .admin-list{display:flex;flex-direction:column;gap:10px}
    .admin-row{display:flex;align-items:center;gap:12px;background:var(--surface);border:1.5px solid var(--border);border-radius:14px;padding:12px 16px;flex-wrap:wrap}
    .admin-row .ar-title{font-weight:700;flex:1;min-width:180px}
    .admin-row .ar-cat{font-size:.8rem;color:var(--saffron);background:var(--gold-light);padding:2px 10px;border-radius:99px}
    .ar-btns{display:flex;gap:6px}
    .ar-btns button,.ar-btns a{padding:7px 13px;border-radius:9px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-weight:600;font-size:.85rem;cursor:pointer}
    .ar-btns .del:hover{border-color:#d33;color:#d33}
    .ar-btns .edit:hover,.ar-btns a:hover{border-color:var(--saffron);color:var(--saffron)}
    .mode-banner{padding:12px 18px;border-radius:14px;background:var(--gold-light);border:1.5px dashed var(--gold);font-size:.92rem;margin-bottom:18px}
    /* लॉगिन */
    .login-card{max-width:420px;margin:60px auto;text-align:center}
    .login-card input{text-align:center;letter-spacing:2px}
    .check-row{display:flex;align-items:center;gap:8px;font-weight:700}
    .check-row input{width:20px;height:20px;accent-color:var(--saffron)}
  </style>
</head>
<body>
  <header class="site-header" id="siteHeader"></header>

  <main class="admin-wrap">
    <!-- लॉगिन -->
    <div id="loginView" style="display:none">
      <div class="form-card login-card">
        <h1 style="margin-bottom:6px">🔐 एडमिन लॉगिन</h1>
        <p style="color:var(--text-soft);margin-bottom:18px" id="loginHint"></p>
        <div class="field" id="emailField" style="display:none;margin-bottom:12px">
          <input type="email" id="adminEmail" placeholder="ईमेल">
        </div>
        <div class="field" style="margin-bottom:14px">
          <input type="password" id="adminPass" placeholder="पासवर्ड">
        </div>
        <button class="btn publish" id="loginBtn" style="width:100%">लॉगिन करें</button>
      </div>
    </div>

    <!-- एडमिन -->
    <div id="adminView" style="display:none">
      <div class="page-title" style="padding-top:10px">
        <h1>⚙️ एडमिन पैनल</h1>
        <p>बिना कोडिंग के भजन जोड़ें, संपादित करें और हटाएँ।</p>
      </div>

      <div class="mode-banner" id="modeBanner"></div>

      <div class="admin-tabs">
        <button id="tabAdd" class="active">➕ नया भजन जोड़ें</button>
        <button id="tabList">📋 सभी भजन</button>
        <button id="logoutBtn" style="margin-left:auto">🚪 लॉगआउट</button>
      </div>

      <!-- फॉर्म -->
      <div class="form-card" id="addView">
        <h2 id="formHeading" style="margin-bottom:18px">नया भजन जोड़ें</h2>
        <input type="hidden" id="editId">
        <div class="form-grid two">
          <div class="field">
            <label>भजन का शीर्षक *</label>
            <input type="text" id="fTitle" placeholder="जैसे: जय गणेश जय गणेश देवा">
          </div>
          <div class="field">
            <label>श्रेणी *</label>
            <select id="fCategory"></select>
          </div>
          <div class="field">
            <label>गायक <small>(वैकल्पिक)</small></label>
            <input type="text" id="fSinger" placeholder="जैसे: अनूप जलोटा">
          </div>
          <div class="field">
            <label>YouTube लिंक <small>(वैकल्पिक)</small></label>
            <input type="url" id="fYoutube" placeholder="https://youtube.com/watch?v=...">
          </div>
        </div>

        <div class="field" style="margin-top:16px">
          <label>भजन के बोल (Lyrics) *</label>
          <div class="rte-toolbar">
            <button type="button" data-cmd="bold" title="मोटा"><b>B</b></button>
            <button type="button" data-cmd="italic" title="तिरछा"><i>I</i></button>
            <button type="button" data-cmd="underline" title="रेखांकित"><u>U</u></button>
            <button type="button" data-cmd="justifyLeft" title="बाएँ">⬅</button>
            <button type="button" data-cmd="justifyCenter" title="बीच में">↔</button>
            <button type="button" data-cmd="removeFormat" title="फॉर्मेट हटाएँ">✕</button>
          </div>
          <div id="rte" contenteditable="true" data-placeholder="यहाँ भजन के बोल लिखें या पेस्ट करें..."></div>
        </div>

        <div class="form-grid two" style="margin-top:16px">
          <div class="field">
            <label>थंबनेल इमेज <small>(वैकल्पिक — अपने-आप छोटी हो जाएगी)</small></label>
            <input type="file" id="fThumb" accept="image/*">
            <img class="thumb-preview" id="thumbPreview" alt="थंबनेल">
          </div>
          <div class="field" style="display:flex;align-items:center">
            <label class="check-row" style="margin:0">
              <input type="checkbox" id="fFeatured"> ⭐ विशेष भजन (Homepage पर दिखे)
            </label>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn publish" id="publishBtn">🚀 प्रकाशित करें</button>
          <button class="btn ghost" id="resetBtn">फॉर्म साफ़ करें</button>
        </div>
      </div>

      <!-- सूची -->
      <div id="listView" style="display:none">
        <div class="filter-bar">
          <input type="search" id="listSearch" placeholder="सूची में खोजें...">
        </div>
        <div class="admin-list" id="adminList"></div>
      </div>
    </div>
  </main>

  <footer class="site-footer" id="siteFooter"></footer>

  <script>window.BL_BASE = "../";</script>
  <script src="../js/firebase-config.js"></script>
  <script src="../js/data.js"></script>
  <script src="../js/app.js"></script>
  <script src="admin.js"></script>
</body>
</html>
